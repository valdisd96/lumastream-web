apiVersion: v1
kind: Namespace
metadata:
  name: lumastream-web
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    app.kubernetes.io/part-of: lumastream-web
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: lumastream-web
spec:
  hard:
    requests.cpu: 200m
    requests.memory: 256Mi
    limits.cpu: '1'
    limits.memory: 512Mi
    pods: '2'
    persistentvolumeclaims: '1'
    requests.storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: analytics
  namespace: lumastream-web
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumastream-web
  namespace: lumastream-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lumastream-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumastream-web
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/valdisd96/lumastream-web:initial
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9090}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: analytics, mountPath: /data}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 12
            periodSeconds: 5
      volumes:
        - name: analytics
          persistentVolumeClaim:
            claimName: analytics
---
apiVersion: v1
kind: Service
metadata:
  name: lumastream-web
  namespace: lumastream-web
  labels:
    app.kubernetes.io/name: lumastream-web
spec:
  selector:
    app.kubernetes.io/name: lumastream-web
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: metrics, port: 9090, targetPort: metrics}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lumastream-web
  namespace: lumastream-web
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lumastream-web
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports: [{port: '8080', protocol: TCP}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports: [{port: '9090', protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{port: '53', protocol: UDP}, {port: '53', protocol: TCP}]
          rules:
            dns:
              - matchPattern: '*'
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports: [{port: '443', protocol: TCP}]
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: lumastream-gateway
  namespace: lumastream-web
spec:
  from:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: gateway-demo}
  to:
    - {group: '', kind: Service, name: lumastream-web}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lumastream-web
  namespace: gateway-demo
spec:
  parentRefs:
    - {name: demo, sectionName: https}
  hostnames: [uvauchok-lab.duckdns.org]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /lumastream}
      backendRefs:
        - {name: lumastream-web, namespace: lumastream-web, port: 8080}
